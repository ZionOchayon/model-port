# Added by make up only when SLACK_WEBHOOK_URL is set: alerts go to Slack. The URL stays in the Secret
# alertmanager-slack (scripts/secrets.sh), never in these values.
alertmanager:
  alertmanagerSpec:
    secrets: [alertmanager-slack] # mounted at /etc/alertmanager/secrets/alertmanager-slack/
  config: # replaces the base route: everything but Watchdog goes to Slack
    route:
      receiver: slack
      group_by: [alertname, model, application]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname = "Watchdog"']
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
            send_resolved: true
            title: "{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})"
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'
