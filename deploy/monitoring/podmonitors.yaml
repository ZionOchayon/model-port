# Every Ray cluster in namespace ray (training RayJobs, the shared cluster, the RayService), as in the KubeRay guide.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: { name: ray-head, namespace: monitoring }
spec:
  jobLabel: ray-head
  namespaceSelector: { matchNames: [ray] }
  selector:
    matchLabels: { ray.io/node-type: head }
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
      relabelings:
        - { action: replace, sourceLabels: [__meta_kubernetes_pod_label_ray_io_cluster], targetLabel: ray_io_cluster }
        - { action: replace, sourceLabels: [__meta_kubernetes_pod_label_modelport_dev_kind], targetLabel: modelport_kind }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: { name: ray-workers, namespace: monitoring }
spec:
  jobLabel: ray-workers
  namespaceSelector: { matchNames: [ray] }
  selector:
    matchLabels: { ray.io/node-type: worker }
  podMetricsEndpoints:
    - port: metrics
      interval: 15s
      relabelings:
        - { action: replace, sourceLabels: [__meta_kubernetes_pod_label_ray_io_cluster], targetLabel: ray_io_cluster }
        - { action: replace, sourceLabels: [__meta_kubernetes_pod_label_modelport_dev_kind], targetLabel: modelport_kind }
