# The long-lived RayCluster for short jobs (evaluation, batch inference). Workers scale from zero.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: modelport-shared
  namespace: ray
  labels: { app.kubernetes.io/part-of: modelport, modelport.dev/kind: shared }
spec:
  rayVersion: "2.60.1"
  enableInTreeAutoscaling: true
  autoscalerOptions:
    upscalingMode: Default
    idleTimeoutSeconds: 60
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  headGroupSpec:
    rayStartParams: { num-cpus: "0", dashboard-host: 0.0.0.0, metrics-export-port: "8080" }
    template:
      metadata: { labels: { app.kubernetes.io/part-of: modelport, modelport.dev/kind: shared } }
      spec:
        containers:
          - name: ray-head
            image: __RAY_IMAGE__
            imagePullPolicy: IfNotPresent
            envFrom:
              - configMapRef: { name: modelport-platform-env }
              - secretRef: { name: s3-credentials }
            env:
              - { name: RAY_TRAIN_V2_ENABLED, value: "1" }
            ports:
              - { containerPort: 6379, name: gcs }
              - { containerPort: 8265, name: dashboard }
              - { containerPort: 10001, name: client }
              - { containerPort: 8080, name: metrics }
            resources:
              requests: { cpu: 250m, memory: 2Gi }
              limits: { cpu: "1", memory: 4Gi }
  workerGroupSpecs:
    - groupName: batch
      replicas: 0
      minReplicas: 0
      maxReplicas: 2
      rayStartParams: { num-cpus: "2", metrics-export-port: "8080" }
      template:
        metadata: { labels: { app.kubernetes.io/part-of: modelport, modelport.dev/kind: shared } }
        spec:
          containers:
            - name: ray-worker
              image: __RAY_IMAGE__
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef: { name: modelport-platform-env }
                - secretRef: { name: s3-credentials }
              env:
                - { name: RAY_TRAIN_V2_ENABLED, value: "1" }
              ports: [{ containerPort: 8080, name: metrics }]
              resources:
                requests: { cpu: "1", memory: 3Gi }
                limits: { cpu: "2", memory: 4Gi }
