apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: minio-data, namespace: platform }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: platform, labels: { app: minio } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      securityContext: { runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: minio
          image: __MINIO_IMAGE__
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--address", ":9000"]
          ports: [{ containerPort: 9000, name: s3 }]
          env:
            - {
                name: MINIO_ROOT_USER,
                valueFrom:
                  { secretKeyRef: { name: minio-credentials, key: root-user } },
              }
            - {
                name: MINIO_ROOT_PASSWORD,
                valueFrom:
                  {
                    secretKeyRef:
                      { name: minio-credentials, key: root-password },
                  },
              }
            - { name: MINIO_PROMETHEUS_AUTH_TYPE, value: public }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: s3 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /minio/health/live, port: s3 }
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: platform, labels: { app: minio } }
spec:
  selector: { app: minio }
  ports: [{ port: 9000, targetPort: s3, name: s3 }]
