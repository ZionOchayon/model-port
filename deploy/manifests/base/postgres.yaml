apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-init, namespace: platform }
data:
  01-databases.sh: |
    #!/bin/bash
    # Runs once on an empty data directory (official image behaviour).
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 --username postgres <<SQL
    CREATE ROLE airflow LOGIN PASSWORD '${AIRFLOW_DB_PASSWORD}';
    CREATE ROLE mlflow LOGIN PASSWORD '${MLFLOW_DB_PASSWORD}';
    CREATE DATABASE airflow OWNER airflow;
    CREATE DATABASE mlflow OWNER mlflow;
    SQL
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: platform, labels: { app: postgres } }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: __POSTGRES_IMAGE__
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5432, name: postgres }]
          env:
            - {
                name: POSTGRES_PASSWORD,
                valueFrom:
                  {
                    secretKeyRef:
                      { name: postgres-credentials, key: postgres-password },
                  },
              }
            - {
                name: AIRFLOW_DB_PASSWORD,
                valueFrom:
                  {
                    secretKeyRef:
                      { name: postgres-credentials, key: airflow-password },
                  },
              }
            - {
                name: MLFLOW_DB_PASSWORD,
                valueFrom:
                  {
                    secretKeyRef:
                      { name: postgres-credentials, key: mlflow-password },
                  },
              }
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"] } # TCP: the init-time temporary server listens on the socket only
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"] } # TCP: the init-time temporary server listens on the socket only
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql } # PG 18 image: PGDATA=/var/lib/postgresql/18/docker
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 0755 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources: { requests: { storage: 2Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: platform }
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: postgres, name: postgres }]
