# One-node kind cluster for modelport. Created by scripts/cluster.sh (make up).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: modelport
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        systemReserved:
          cpu: "100m"
          memory: "256Mi"
        evictionHard:
          memory.available: "200Mi"
