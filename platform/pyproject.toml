[project]
name = "modelport-platform"
version = "0.1.0"
description = "modelport platform services, Ray entrypoints and Airflow DAG helpers"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "modelport",
  "boto3>=1.40",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
airflow = [
  "kubernetes==36.0.3",
  "pillow==13.0.0",                # simulate_drift perturbs images
  "ray[default]==2.60.1",          # Jobs API client only
]
ray = [
  "ray[default,train,serve,data]==2.60.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelport_platform"]
