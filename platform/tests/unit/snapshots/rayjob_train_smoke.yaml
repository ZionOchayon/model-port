apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: train-fashion-classifier-fba02a7a
  namespace: ray
  labels:
    app.kubernetes.io/part-of: modelport
    modelport.dev/model: fashion-classifier
    modelport.dev/kind: train
spec:
  entrypoint: python -m modelport_platform.train.entrypoint --model fashion-classifier
    --submission-run-id 9f2c1d --spec-file model.fashion.yaml --rayjob train-fashion-classifier-fba02a7a
  runtimeEnvYAML: "pip:\n  packages:\n  - torch==2.15.0\n  - torchvision==0.29.2\n\
    \  - pillow==13.0.0\n  pip_check: false\nworking_dir: s3://mlflow/1/9f2c1d/artifacts/code/code.zip\n"
  shutdownAfterJobFinishes: true
  ttlSecondsAfterFinished: 60
  activeDeadlineSeconds: 3600
  backoffLimit: 1
  submissionMode: K8sJobMode
  submitterPodTemplate:
    spec:
      restartPolicy: Never
      containers:
      - name: ray-job-submitter
        image: modelport/ray:0123456789ab
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
          limits:
            cpu: '1'
            memory: 1Gi
  rayClusterSpec:
    rayVersion: 2.60.1
    headGroupSpec:
      rayStartParams:
        num-cpus: '0'
        dashboard-host: 0.0.0.0
        metrics-export-port: '8080'
      template:
        metadata:
          labels: &id001
            modelport.dev/model: fashion-classifier
            modelport.dev/kind: train
        spec:
          containers:
          - name: ray-head
            image: modelport/ray:0123456789ab
            imagePullPolicy: IfNotPresent
            envFrom:
            - configMapRef:
                name: modelport-platform-env
            - secretRef:
                name: s3-credentials
            env: &id002
            - name: RAY_TRAIN_V2_ENABLED
              value: '1'
            ports:
            - containerPort: 6379
              name: gcs
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
            - containerPort: 8080
              name: metrics
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                cpu: '1'
                memory: 3Gi
    workerGroupSpecs:
    - groupName: workers
      replicas: 2
      minReplicas: 2
      maxReplicas: 2
      rayStartParams:
        metrics-export-port: '8080'
      resources:
        CPU: '2'
        modelport_train_slot: '1'
      template:
        metadata:
          labels: *id001
        spec:
          containers:
          - name: ray-worker
            image: modelport/ray:0123456789ab
            imagePullPolicy: IfNotPresent
            envFrom:
            - configMapRef:
                name: modelport-platform-env
            - secretRef:
                name: s3-credentials
            env: *id002
            ports:
            - containerPort: 8080
              name: metrics
            resources:
              requests:
                cpu: 250m
                memory: 2Gi
              limits:
                cpu: '1'
                memory: 2Gi
