apiVersion: ray.io/v1
kind: RayService
metadata:
  name: modelport-serve
  namespace: ray
  labels:
    app.kubernetes.io/part-of: modelport
    modelport.dev/kind: serve
spec:
  serviceUnhealthySecondThreshold: 900
  deploymentUnhealthySecondThreshold: 300
  upgradeStrategy:
    type: NewCluster
  serveConfigV2: "applications:\n- args:\n    model: m\n  import_path: x:y\n  name:\
    \ m\n  route_prefix: /m\nhttp_options:\n  host: 0.0.0.0\n  port: 8000\n"
  rayClusterConfig:
    rayVersion: 2.60.1
    headGroupSpec:
      rayStartParams:
        num-cpus: '0'
        dashboard-host: 0.0.0.0
        metrics-export-port: '8080'
      template:
        metadata:
          labels: &id001
            modelport.dev/kind: serve
        spec:
          containers:
          - name: ray-head
            image: modelport/ray:0123456789ab
            imagePullPolicy: IfNotPresent
            envFrom:
            - configMapRef:
                name: modelport-platform-env
            - secretRef:
                name: s3-credentials
            env: &id002
            - name: RAY_TRAIN_V2_ENABLED
              value: '1'
            ports:
            - containerPort: 6379
              name: gcs
            - containerPort: 8265
              name: dashboard
            - containerPort: 10001
              name: client
            - containerPort: 8080
              name: metrics
            - containerPort: 8000
              name: serve
            resources:
              requests:
                cpu: 250m
                memory: 2Gi
              limits:
                cpu: '1'
                memory: 4Gi
    workerGroupSpecs:
    - groupName: serve
      replicas: 2
      minReplicas: 2
      maxReplicas: 2
      rayStartParams:
        metrics-export-port: '8080'
        num-cpus: '2'
      template:
        metadata:
          labels: *id001
        spec:
          containers:
          - name: ray-worker
            image: modelport/ray:0123456789ab
            imagePullPolicy: IfNotPresent
            envFrom:
            - configMapRef:
                name: modelport-platform-env
            - secretRef:
                name: s3-credentials
            env: *id002
            ports:
            - containerPort: 8080
              name: metrics
            resources:
              requests:
                cpu: '1'
                memory: 3Gi
              limits:
                cpu: '2'
                memory: 4Gi
