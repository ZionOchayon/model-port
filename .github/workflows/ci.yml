name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # weekly: catch rot (removed images, wheels, charts)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_COLOR: "1"
  UV_FROZEN: "1"
  # Highest stage whose e2e steps exist; raised as each release's flow lands.
  MODELPORT_STAGE: v0.3

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.10"

      - name: Install kind, kubectl, helm (pinned, sha256-checked)
        run: sudo DEST=/usr/local/bin bash scripts/install-tools.sh

      # bash -e ignores the status of a negated command, so negative checks use explicit `if`.
      - name: "Hygiene: pinned versions"
        run: uv run python scripts/check_versions.py

      - name: "Hygiene: private drafts not committed"
        run: if git ls-files | grep -qE '^drafts/'; then echo "drafts/ must never be committed"; exit 1; fi

      - name: "Hygiene: line endings"
        run: if git ls-files --eol | grep 'i/crlf'; then exit 1; fi

      - name: "Hygiene: license"
        run: grep -q 'Apache License' LICENSE && grep -q 'Fashion-MNIST' NOTICE && grep -q 'Covertype' NOTICE

      - name: "Hygiene: banned names"
        env:
          BANNED_NAMES: ${{ secrets.BANNED_NAMES }}
        run: |
          if [ -z "$BANNED_NAMES" ]; then echo "::warning::secret BANNED_NAMES not set; skipping"; exit 0; fi
          printf '%s\n' "$BANNED_NAMES" | sed '/^$/d' > "$RUNNER_TEMP/banned.txt"
          if git grep -n -i -w -F -f "$RUNNER_TEMP/banned.txt" -- .; then echo "banned name found"; exit 1; fi

      - name: "Hygiene: banned phrases"
        run: if grep -niE 'production[- ](grade|ready)|enterprise[- ]grade|scales to' README.md; then exit 1; fi

      - name: Sync
        run: uv sync --all-packages --group dev

      - name: Lint
        run: make lint

      - name: Types
        run: make typecheck

      - name: Tests (unit, contract, local integration)
        run: make test

      - name: Docs coverage (the latest released stage)
        run: uv run python scripts/check_docs.py

      # Each chart is linted once its values file exists in the repo.
      - name: Helm lint
        run: |
          helm repo add kuberay https://ray-project.github.io/kuberay-helm/ --force-update
          helm repo add apache-airflow https://airflow.apache.org --force-update
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts --force-update
          set -a; . ./versions.env; set +a
          charts="$RUNNER_TEMP/charts"
          helm pull kuberay/kuberay-operator --version "$KUBERAY_VERSION" --untar -d "$charts"
          helm pull apache-airflow/airflow --version "$AIRFLOW_CHART_VERSION" --untar -d "$charts"
          helm pull prometheus-community/kube-prometheus-stack --version "$KPS_CHART_VERSION" --untar -d "$charts"
          helm pull prometheus-community/prometheus-pushgateway --version "$PUSHGATEWAY_CHART_VERSION" --untar -d "$charts"
          uv run python scripts/check_versions.py --kps-chart "$charts/kube-prometheus-stack"
          lint() {
            local chart=$1; shift
            for f in "$@"; do [ -f "$f" ] || { echo "::notice::helm lint $chart: $f not present yet"; return 0; }; done
            helm lint --strict "$charts/$chart" $(printf -- '-f %s ' "$@")
          }
          lint kuberay-operator deploy/helm/kuberay-operator.values.yaml
          lint airflow deploy/helm/airflow.values.yaml
          lint airflow deploy/helm/airflow.values.yaml deploy/helm/airflow.smoke.values.yaml
          lint kube-prometheus-stack deploy/helm/kube-prometheus-stack.values.yaml
          lint kube-prometheus-stack deploy/helm/kube-prometheus-stack.values.yaml deploy/helm/kube-prometheus-stack.smoke.values.yaml
          lint prometheus-pushgateway deploy/helm/pushgateway.values.yaml
          lint kube-prometheus-stack deploy/helm/kube-prometheus-stack.values.yaml deploy/helm/kube-prometheus-stack.slack.values.yaml
          # the Alertmanager config, with and without Slack, as the chart renders it
          mkdir -p .data
          for extra in "" "-f deploy/helm/kube-prometheus-stack.slack.values.yaml"; do
            helm template kps "$charts/kube-prometheus-stack" -n monitoring -f deploy/helm/kube-prometheus-stack.values.yaml $extra > .data/kps.yaml
            uv run python scripts/extract_rules.py --alertmanager .data/kps.yaml .data/alertmanager-rendered.yaml
            docker run --rm -v "$PWD/.data:/w" --entrypoint amtool "$ALERTMANAGER_IMAGE" check-config /w/alertmanager-rendered.yaml
          done
          grep -q api_url_file .data/alertmanager-rendered.yaml

      - name: Kustomize renders
        run: |
          for d in deploy/manifests/overlays/full deploy/manifests/overlays/smoke deploy/monitoring; do
            if [ -f "$d/kustomization.yaml" ]; then kubectl kustomize "$d" > /dev/null; else echo "::notice::$d not present yet"; fi
          done

      - name: promtool check rules
        run: |
          set -a; . ./versions.env; set +a
          uv run python scripts/extract_rules.py deploy/monitoring/prometheus-rules.yaml deploy/monitoring/.rules.generated.yaml
          docker run --rm -v "$PWD/deploy/monitoring:/w" -w /w --entrypoint promtool "$PROMETHEUS_IMAGE" check rules .rules.generated.yaml

      - name: promtool rules tests (FR-17)
        if: hashFiles('deploy/monitoring/rules-tests.yaml') != ''
        run: make rules-test

  dags:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.10"
      - name: DAG tests with the Airflow image's locked environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/af"
          . "$RUNNER_TEMP/af/bin/activate"
          uv pip install --require-hashes -r deploy/images/airflow/requirements.lock
          uv pip install pytest==9.2.0
          uv pip install --no-deps ./sdk ./platform
          AIRFLOW_HOME="$RUNNER_TEMP/airflow" pytest platform/tests/dags -m "not kind"

  e2e:
    needs: [static, dags]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1

      # The Ray and Airflow images are several GB and `kind load` stores a second copy inside the node.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.10"

      - name: Install kind, kubectl, helm (pinned, sha256-checked)
        run: sudo DEST=/usr/local/bin bash scripts/install-tools.sh

      - name: Sync
        run: uv sync --all-packages --group dev

      # MinIO is built from source (ADR-0003); cache the image tarball by release and Dockerfile.
      - name: Cache MinIO image
        id: minio-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/minio-image.tar
          key: minio-${{ hashFiles('versions.env', 'deploy/images/minio/Dockerfile') }}

      - name: Load cached MinIO image
        if: steps.minio-cache.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/minio-image.tar"

      - name: Up (FR-1)
        run: make up PROFILE=smoke

      - name: ServiceMonitors (FR-14)
        run: kubectl --context kind-modelport get servicemonitor -n monitoring pushgateway airflow-statsd mlflow minio

      - name: Save MinIO image for the cache
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: |
          set -a; . ./versions.env; set +a
          docker save "modelport/minio:$MINIO_RELEASE" -o "$RUNNER_TEMP/minio-image.tar"

      - name: Preflight negative
        run: |
          if UP_MIN_MEM_GIB=1024 bash scripts/up.sh > preflight.log 2>&1; then cat preflight.log; exit 1; fi
          grep -q 'preflight: engine memory' preflight.log

      - name: End-to-end flow and verify
        run: bash scripts/e2e.sh "$MODELPORT_STAGE"

      - name: Negative verify
        run: |
          # verify must fail when evidence is missing (it checks artifacts, not exit codes)
          if uv run python scripts/verify.py --profile smoke --model does-not-exist --checks V-02; then exit 1; fi

      - name: Collect logs
        if: failure()
        run: bash scripts/collect-logs.sh

      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: e2e-logs
          path: artifacts

      - name: Down
        if: always()
        run: make down

  nfr3:
    # NFR-3: `make up` within 15 minutes on a machine that already has the images.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [static]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.10"
      - name: Install kind, kubectl, helm (pinned, sha256-checked)
        run: sudo DEST=/usr/local/bin bash scripts/install-tools.sh
      - name: First up (pulls and builds images)
        run: make up PROFILE=smoke && make down
      - name: Timed up with images present
        run: |
          start=$(date +%s)
          make up PROFILE=smoke
          elapsed=$(( $(date +%s) - start ))
          echo "make up took ${elapsed}s"
          echo "NFR-3 make up seconds: ${elapsed}" >> "$GITHUB_STEP_SUMMARY"
          test "$elapsed" -le 900
      - name: Second up on the running stack is a no-op
        run: make up PROFILE=smoke
      - name: Memory in use
        run: |
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' modelport-control-plane | tee -a "$GITHUB_STEP_SUMMARY"
          # Per-container working set (kind has no metrics-server, so `kubectl top` is unavailable).
          docker exec modelport-control-plane crictl stats -o json \
            | jq -r '.stats[] | select(.memory.workingSetBytes.value != null)
                     | "\(.attributes.labels["io.kubernetes.pod.namespace"])/\(.attributes.labels["io.kubernetes.container.name"]) \((.memory.workingSetBytes.value|tonumber)/1048576|floor) MiB"' \
            | sort
      - name: Down
        if: always()
        run: make down
