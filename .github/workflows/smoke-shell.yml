name: smoke-shell

# Manual: bring up the smoke stack on a fresh runner and run the given shell commands against it.
# For checking a change on kind before it is part of scripts/e2e.sh. Logs are uploaded on failure.
on:
  workflow_dispatch:
    inputs:
      commands:
        description: "Bash commands to run after `make up PROFILE=smoke && make ui` (repo root, credentials loaded)"
        required: true

permissions:
  contents: read

jobs:
  smoke-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.10"
      - name: Install kind, kubectl, helm (pinned, sha256-checked)
        run: sudo DEST=/usr/local/bin bash scripts/install-tools.sh
      - name: Sync
        run: uv sync --all-packages --group dev
      - name: Up
        run: make up PROFILE=smoke
      - name: Commands
        env:
          COMMANDS: ${{ inputs.commands }}
        run: |
          make ui
          set -a; . .modelport/credentials.env; set +a
          bash -euo pipefail -c "$COMMANDS"
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p artifacts
          k="kubectl --context kind-modelport"
          $k get all -A -o wide > artifacts/get-all.txt 2>&1 || true
          $k get rayjobs,rayclusters,rayservices -A -o yaml > artifacts/ray-crs.yaml 2>&1 || true
          $k describe pods -A > artifacts/describe-pods.txt 2>&1 || true
          $k get events -A --sort-by=.lastTimestamp > artifacts/events.txt 2>&1 || true
          sched=$($k get pod -n platform -l component=scheduler -o name | head -1)
          $k exec -n platform "${sched#pod/}" -- tar czf - -C /opt/airflow logs > artifacts/airflow-logs.tgz 2>/dev/null || true  # names contain ":"
          cp /tmp/modelport-ui-*.log artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: smoke-shell-logs
          path: artifacts
      - name: Down
        if: always()
        run: make down
